name: Mod build and release

on:
 push:
  branches: [main]
  paths:
   - "ci/**"
   - "work/mod/**"
   - "assets/artwork/launcher-icon.png"
   - ".github/workflows/mod-release.yml"
 pull_request:
  paths:
   - "ci/**"
   - "work/mod/**"
   - "assets/artwork/launcher-icon.png"
   - ".github/workflows/mod-release.yml"
 schedule:
  - cron: "27 2 * * *"
 workflow_dispatch:
  inputs:
   version:
    description: "Exact upstream version (blank = latest)"
    required: false
    type: string

permissions:
 contents: read

concurrency:
 group: mod-${{ github.ref }}
 cancel-in-progress: false

defaults:
 run:
  shell: bash

jobs:
 checks:
  runs-on: ubuntu-24.04
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
     with:
      persist-credentials: false
   - name: Test download and compatibility boundaries
     run: |
      python3 -m unittest discover -s ci -p 'test_*.py' -v
      bash -n work/mod/build_native.sh work/mod/build_base.sh work/mod/build_release.sh

 release:
  needs: checks
  if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-24.04
  timeout-minutes: 60
  permissions:
   contents: write
  env:
   ANDROID_HOME: /usr/local/lib/android/sdk
   BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/37.0.0
   ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/30.0.16248370
   ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-36.1/android.jar
  steps:
   - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
     with:
      fetch-depth: 0
      persist-credentials: false
   - name: Resolve semantic mod version and skip unchanged releases
     id: upstream
     env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version }}
     run: |
      args=()
      if [[ -n "$REQUESTED_VERSION" ]]; then args+=(--version "$REQUESTED_VERSION"); fi
      python3 ci/fetch_apk.py --list "${args[@]}" > "$RUNNER_TEMP/versions.json"
      gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
      python3 - <<'PY'
      import json, os, re, subprocess, sys
      from pathlib import Path
      sys.path.insert(0, 'ci')
      from release_changes import published_mod_tags, previous_release, resolve_version
      from update_manifest import parse_json, semantic_version
      temp = Path(os.environ['RUNNER_TEMP'])
      repository, head = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
      versions = json.loads((temp / 'versions.json').read_text())
      latest = max(versions, key=lambda v: int(v['version_code']))
      name, code = latest['version_name'], int(latest['version_code'])
      if not re.fullmatch(r'[0-9]+(?:[.][0-9A-Za-z_-]+)*', name) or code <= 0:
          raise SystemExit('Unsafe upstream version metadata')
      pages = json.loads((temp / 'releases.json').read_text())
      releases = [r for page in pages for r in (page if isinstance(page, list) else [page])]
      previous = previous_release(Path.cwd(), head, published_mod_tags(pages), None)
      manifest = None
      if previous and semantic_version(previous[0]) is not None:
          prior = next(r for r in releases if r['tag_name'] == previous[0])
          assets = [a for a in prior.get('assets', []) if a.get('name') == 'update.json' and a.get('state') == 'uploaded']
          if len(assets) != 1 or type(assets[0].get('id')) is not int or assets[0]['id'] <= 0:
              raise SystemExit('Previous semantic release has no unique uploaded update.json')
          raw = subprocess.check_output(['gh', 'api', f'repos/{repository}/releases/assets/{assets[0]["id"]}',
                                         '--header', 'Accept: application/octet-stream'], timeout=60)
          manifest = parse_json(raw, 'previous release update.json', 64 * 1024)
          if not isinstance(manifest, dict) or manifest.get('repository') != repository:
              raise SystemExit('Previous update.json belongs to a different repository')
      decision = resolve_version(Path.cwd(), head, previous, name, code, manifest)
      tag = decision['tag']
      existing = next((r for r in releases if r['tag_name'] == tag), None)
      if decision['build'] and existing:
          if not existing['draft']:
              raise SystemExit(f'{tag} is already published; refusing to replace an immutable version')
          if existing.get('target_commitish') != head:
              raise SystemExit(f'Draft {tag} belongs to another commit; reconcile the draft before retrying')
      with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
          out.write(f'version={name}\ncode={code}\ntag={tag}\nmod_version={decision["mod_version"]}\n'
                    f'exists={str(existing is not None).lower()}\nbuild={str(decision["build"]).lower()}\n')
      print(f'Stormline {tag}; game {name} ({code}); '+('building' if decision['build'] else 'unchanged, skipped'))
      PY
   - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
     if: steps.upstream.outputs.build == 'true'
     with:
      distribution: temurin
      java-version: "21"
   - name: Install pinned build tools
     if: steps.upstream.outputs.build == 'true'
     run: |
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36.1' 'build-tools;37.0.0' 'ndk;30.0.16248370'
      mkdir -p "$RUNNER_TEMP/tools"
      curl --fail --location --silent --show-error --retry 2 \
        'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
        -o "$RUNNER_TEMP/tools/apktool.jar"
      printf '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  %s\n' "$RUNNER_TEMP/tools/apktool.jar" | sha256sum --check
      printf '#!/usr/bin/env bash\nexec java -Xmx2g -jar "%s" "$@"\n' "$RUNNER_TEMP/tools/apktool.jar" > "$RUNNER_TEMP/tools/apktool"
      chmod +x "$RUNNER_TEMP/tools/apktool"
   - name: Download genuine arm64 APK set
     if: steps.upstream.outputs.build == 'true'
     env:
      UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
     run: python3 ci/fetch_apk.py --version "$UPSTREAM_VERSION" --output "$RUNNER_TEMP/upstream"
   - name: Refuse incompatible native game code
     if: steps.upstream.outputs.build == 'true'
     env:
      UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
      UPSTREAM_CODE: ${{ steps.upstream.outputs.code }}
     run: |
      python3 ci/check_apks.py "$RUNNER_TEMP/upstream" --build-tools "$BUILD_TOOLS" > "$RUNNER_TEMP/compatibility.json"
      python3 - <<'PY'
      import json, os
      from pathlib import Path
      report = json.loads((Path(os.environ['RUNNER_TEMP'])/'compatibility.json').read_text())
      if report['version_name'] != os.environ['UPSTREAM_VERSION'] or int(report['version_code']) != int(os.environ['UPSTREAM_CODE']):
          raise SystemExit('Downloaded APK version differs from selected upstream version')
      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
          out.write('## Compatibility gate\n\nValidated package, original signer, split set, native code and metadata.\n\n')
          out.write('```json\n'+json.dumps(report, indent=2)+'\n```\n')
      PY
   - name: Build and sign with existing install identity
     if: steps.upstream.outputs.build == 'true'
     env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
      KS_ALIAS: ${{ secrets.KS_ALIAS }}
      MOD_RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
      MOD_BUILD_NUMBER: ${{ github.run_number }}
      MOD_REVISION: ${{ github.sha }}
      MOD_REPOSITORY: ${{ github.repository }}
     run: |
      [[ -n "$KEYSTORE_B64" && -n "$KS_PASS" && -n "$KS_ALIAS" ]] || { echo 'Signing secrets missing; refusing to generate a different key' >&2; exit 1; }
      umask 077
      export KEYSTORE="$RUNNER_TEMP/mod.keystore"
      export PULLED_DIR="$RUNNER_TEMP/upstream"
      export APKTOOL="$RUNNER_TEMP/tools/apktool"
      trap 'rm -f "$KEYSTORE"' EXIT
      printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
      bash work/mod/build_release.sh
   - name: Prepare release checksums and notes
     if: steps.upstream.outputs.build == 'true'
     env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
      MOD_VERSION: ${{ steps.upstream.outputs.mod_version }}
      UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
      UPSTREAM_CODE: ${{ steps.upstream.outputs.code }}
     run: |
      cp "$RUNNER_TEMP/compatibility.json" work/mod/out/release/compatibility.json
      cp "$RUNNER_TEMP/upstream/source.json" work/mod/out/release/source.json
      python3 ci/update_manifest.py release --release-dir work/mod/out/release --report "$RUNNER_TEMP/compatibility.json" --build-tools "$BUILD_TOOLS"
      (cd work/mod/out/release && sha256sum -- *.apk compatibility.json source.json update.json > SHA256SUMS)
      python3 ci/release_changes.py --repository "$GITHUB_REPOSITORY" --head "$GITHUB_SHA" --current-tag "$RELEASE_TAG" \
        --releases "$RUNNER_TEMP/releases.json" --changelog CHANGELOG.md --output "$RUNNER_TEMP/changes.md"
      python3 - <<'PY'
      import os
      from pathlib import Path
      version, code = os.environ['UPSTREAM_VERSION'], os.environ['UPSTREAM_CODE']
      repo, commit = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
      mod_version = os.environ['MOD_VERSION']
      changes = (Path(os.environ['RUNNER_TEMP'])/'changes.md').read_text().strip()
      text = f'''![TOE3 Stormline artwork featuring a gold tanker truck on a rainy motorway](https://raw.githubusercontent.com/{repo}/{commit}/assets/artwork/mod-hero.webp)

      _Promotional artwork, not an in-game screenshot._

      **TOE3 Stormline v{mod_version}** is an unofficial, experimental mod for **Truckers of Europe 3 {version}** (build {code}) on Android arm64. The mod and game versions are independent. A draggable in-game menu changes money, weather, truck, job and shop settings while you play. No root or "display over other apps" permission is required.

      ### Changes in this build

      {changes}

      Curated release history: [CHANGELOG.md](https://github.com/{repo}/blob/main/CHANGELOG.md)

      ### Menu controls

      - **Economy:** money, gold, wash tickets, level and XP overrides; ad-free and trailer-unlock flags
      - **Weather and world:** clear, rainy, cloudy or foggy weather; clock hour, time freeze and AI traffic count
      - **Truck:** engine power multiplier up to 10×; skip the high-speed auto-tow check
      - **Damage and fuel:** no rain dirt; no truck or trailer/cargo collision damage; free, instant repairs; hold the fuel level; free refuelling
      - **Driver and jobs:** fully rested fatigue value; no delivery penalties; income and XP multipliers up to 20×; rewarded-ad actions without the ad
      - **Shopping and travel:** free trucks, parts, interiors, trailers and garages; free ferry, tolls and towing

      Money, gold, wash tickets, level, rain and rain-dirt prevention start enabled; every other control starts off. Settings persist between launches, and the **Mods** switch turns gameplay changes off together. Disabling a control does not undo purchases, rewards or saved progress.

      The panel uses focused **Home**, mod-category, **World**, **Updates** and **Debug** screens. World shows requested versus actual weather and transition progress. Debug is a read-only viewer for cached Runtime, Weather and Truck data, with sample age and unavailable/stale states.

      Not every control has been tested in gameplay. CI checks packaging, signatures and checksums; it does not play the game.

      ### Updates inside the game

      The launcher name is **TOE3 Stormline**, with a gold-truck **MOD** icon. The package name and signing key stay the same; this is an update to the existing mod, not a separate clone.

      After installing an OTA-enabled build once, open the mod menu's **Updates** section to check GitHub Releases, download the complete APK set and request installation. Files are checked against their hashes and the installed signing certificate. Android still asks you to confirm; on Android 8+ it may also ask you to allow installs from this source. There is no silent install and no root requirement.

      Press **Changelog** after checking to read the automatically generated commit-message changes inside the game, without opening GitHub. **View release** remains an optional separate link. Release text is informational and is not used to authorize APK installation.

      Older mod builds without the updater need the manual installation below once. OTA downloads the full split set, not a small hot patch.

      ### Install

      You need Android platform-tools (`adb`) on a computer, USB debugging enabled on the device, and a shell with `sha256sum`.

      1. Create an empty folder and download **all `.apk` files**, `compatibility.json`, `source.json`, `update.json` and `SHA256SUMS` from this release. Keep the APKs together; a base APK on its own is not a complete install.
      2. In that folder, verify every download. All entries must print `OK`:
         ```sh
         sha256sum --check SHA256SUMS
         ```
      3. From the same folder, with the device connected, install all APKs in one command:
         ```sh
         adb install-multiple -r ./*.apk
         ```

      ### Save data and Google Play Games

      - **Updating this mod:** releases are signed with the same mod key, so a new release installs over an earlier one and keeps its local data.
      - **Switching from the official store build:** the signing key differs, so Android rejects the install until that build is uninstalled. Uninstalling deletes its local save. Back up anything you can recover first.
      - **Google Play Games:** sign-in and cloud saves do not work with the re-signed APKs, including through microG.

      ### Provenance

      - **Mod version:** v{mod_version}, CI build {os.environ['GITHUB_RUN_NUMBER']}; the game version is recorded separately below.
      - **Source:** [`{commit[:12]}`](https://github.com/{repo}/commit/{commit}) in [{repo}](https://github.com/{repo})
      - **Game input:** original arm64-v8a split set for {version} (build {code}), downloaded from APKPure
      - **Compatibility gate:** before modification, CI confirmed the original signing certificate, the complete `UnityDataAssetPack` split, and SHA-256 matches for `libil2cpp.so`, `libunity.so` and `global-metadata.dat` against the reviewed baseline. A game update that changes this code stops the release instead of being ported automatically.
      - **Reports:** `compatibility.json` records the gate result, `source.json` records the upstream download, and `update.json` describes the signed mod build and its APK hashes for the updater. All are covered by `SHA256SUMS`.
      '''
      (Path(os.environ['RUNNER_TEMP'])/'release-notes.md').write_text(text)
      PY
   - name: Publish complete public release
     if: steps.upstream.outputs.build == 'true'
     env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
      RELEASE_EXISTS: ${{ steps.upstream.outputs.exists }}
      RELEASE_TITLE: "TOE3 Stormline v${{ steps.upstream.outputs.mod_version }} | game ${{ steps.upstream.outputs.version }}"
     run: |
      if [[ "$RELEASE_EXISTS" != true ]]; then
        gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --draft --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
      fi
      gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
        work/mod/out/release/*.apk work/mod/out/release/SHA256SUMS \
        work/mod/out/release/compatibility.json work/mod/out/release/source.json work/mod/out/release/update.json
      gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
        --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
   - name: Explain release failure
     if: failure()
     run: |
      printf '%s\n' '## No release published' '' \
        'Inspect the failing step. Changed native game code/metadata requires a reviewed mod port before release; never bypass the compatibility gate.' >> "$GITHUB_STEP_SUMMARY"
